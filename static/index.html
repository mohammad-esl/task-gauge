<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="settings-panel">
        <h4 style="margin:0 0 10px 0; color:var(--accent); letter-spacing:1px">DASHBOARD</h4>
        <table class="stats-table" id="history-table"></table>

        <h5 style="margin:10px 0 5px 0; font-size:10px; color:#555">WEEKLY VIEW</h5>
        <div style="display:flex; gap:6px; margin-bottom:10px;">
            <button class="icon-btn" onclick="changeWeek(-1)">← PREV</button>
            <button class="icon-btn" onclick="changeWeek(0)">THIS WEEK</button>
            <button class="icon-btn" onclick="changeWeek(1)">NEXT →</button>
        </div>

        <div id="week-label" style="font-size:11px; color:#777; margin-bottom:8px;"></div>
        <div id="week-chart"></div>
        <div id="week-legend" class="legend"></div>

        <h5 style="margin:10px 0 5px 0; font-size:10px; color:#555">EDIT TASKS</h5>
        <div id="task-list"></div>
        <button class="icon-btn" style="width:100%; margin-bottom:10px;" onclick="addTaskRow()">+ ADD TASK</button>

        <h5 style="margin:10px 0 5px 0; font-size:10px; color:#555">SUBTASKS</h5>
        <select id="subtask-window-category" style="width:100%; background:#000; color:var(--accent); border:1px solid #444; padding:8px; box-sizing:border-box; font-size:12px; border-radius:4px; margin-bottom:6px;"></select>
        <button class="icon-btn" style="width:100%; margin-bottom:10px;" onclick="openSubtaskWindow()">OPEN SUBTASK WINDOW</button>
        <button class="save-btn" onclick="saveSettings()">APPLY CHANGES</button>
        <button class="save-btn" style="background:#222; color:#777" onclick="toggleSettings()">CLOSE</button>
    </div>

    <div id="gantt-panel">
        <div class="gantt-toolbar">
            <h4 style="margin:0; color:var(--accent); letter-spacing:1px">GANTT / TIMELINE VIEW</h4>
            <div style="display:flex; gap:6px;">
                <button class="icon-btn" onclick="shiftGanttDay(-1)">← PREV DAY</button>
                <button class="icon-btn" onclick="shiftGanttDay(0)">TODAY</button>
                <button class="icon-btn" onclick="shiftGanttDay(1)">NEXT DAY →</button>
                <button class="icon-btn" id="gantt-undo-btn" onclick="undoGanttEdit()" title="Ctrl+Z">↶ UNDO</button>
            </div>
        </div>
        <div id="gantt-date" class="gantt-date"></div>
        <div class="gantt-hint">Drag a block to move it, drag its edges to resize, double-click to type exact times, drag on empty space to create a new block. Ctrl+Z to undo.</div>
        <div id="gantt-chart" class="gantt-frame"></div>
        <button class="save-btn" style="background:#222; color:#777" onclick="toggleGantt()">CLOSE</button>
    </div>

    <div id="jalali-picker" class="jalali-picker">
        <div class="jalali-picker-header">
            <button type="button" onclick="jalaliPickerShiftMonth(-1)">‹</button>
            <span id="jalali-picker-title"></span>
            <button type="button" onclick="jalaliPickerShiftMonth(1)">›</button>
        </div>
        <div id="jalali-picker-weekdays" class="jalali-picker-weekdays"></div>
        <div id="jalali-picker-grid" class="jalali-picker-grid"></div>
    </div>

    <div id="stats-panel">
        <h4 style="margin:0 0 14px 0; color:var(--accent); letter-spacing:1px">RANGE STATS</h4>

        <label class="field-label">Category</label>
        <select id="range-category"></select>

        <div class="stats-date-row">
            <div>
                <label class="field-label">از تاریخ</label>
                <input type="text" id="range-start" class="jalali-date-input" readonly placeholder="از تاریخ" onclick="openJalaliPicker('range-start')">
            </div>
            <div>
                <label class="field-label">تا تاریخ</label>
                <input type="text" id="range-end" class="jalali-date-input" readonly placeholder="تا تاریخ" onclick="openJalaliPicker('range-end')">
            </div>
        </div>

        <button class="save-btn" onclick="loadRangeStats()">GET TOTAL</button>
        <div id="range-result" class="stats-result"></div>
        <button class="save-btn" style="background:#222; color:#777" onclick="toggleStats()">CLOSE</button>
    </div>

    <div id="session-edit-panel">
        <h4 style="margin:0 0 10px 0; color:var(--accent); letter-spacing:1px">EDIT SESSION</h4>
        <label class="field-label">Category</label>
        <select id="edit-category"></select>
        <label class="field-label">Start</label>
        <input type="text" id="edit-start" placeholder="YYYY-MM-DD HH:MM:SS">
        <label class="field-label">End</label>
        <input type="text" id="edit-end" placeholder="YYYY-MM-DD HH:MM:SS">
        <div id="edit-error" class="field-error"></div>
        <div style="display:flex; gap:6px; margin-top:10px;">
            <button class="save-btn" onclick="submitSessionEdit()">SAVE</button>
            <button class="save-btn" style="background:#3a1414; color:#ff8a8a" onclick="deleteSessionFromEditor()">DELETE</button>
            <button class="save-btn" style="background:#222; color:#777" onclick="closeSessionEditor()">CANCEL</button>
        </div>
    </div>

    <div class="main-container" id="app-ui">
        <svg id="hit-surface" viewBox="0 0 100 100"></svg>
        <div id="hub"><div class="needle"></div></div>
        <div id="hub-2"><div class="needle needle-2"></div></div>
        <div class="center-display">
            <div id="session-time" onclick="toggleSettings()">00:00</div>
            <div id="active-subtask-label" style="display:none; font-size:10px; color:var(--accent); letter-spacing:0.5px; margin-top:-4px;"></div>
            <div class="total-box">TOTAL <span id="total-time">00:00:00</span></div>
            <div id="second-task-box"><span id="second-task-name"></span> <span id="second-task-time">00:00</span></div>
            <div class="controls">
                <button class="icon-btn" onclick="toggleGantt()">GANTT</button>
                <button class="icon-btn" onclick="toggleStats()">STATS</button>
                <button class="icon-btn" onclick="resetCurrent()" style="color:var(--red)">RESET</button>
            </div>
        </div>
    </div>

    <script src="jalali.js"></script>
    <script src="app.js"></script>
</body>
</html>
